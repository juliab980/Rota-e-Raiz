<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Link para adicionar SVG dos ícones aqui se necessário -->
    <link rel="stylesheet" href="perfil.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Meu Perfil - Rota & Raiz</title>
</head>
<body>
    <!-- Header -->
    <header class="header-perfil">
        <button class="botao-voltar-perfil" onclick="window.location.href='proxima.html'">← --</button>
        <div class="titulo-header-perfil">Meu perfil</div>
        <div class="logo-header-perfil">
            <img src="logo com nome PNG (2).png" alt="Rota Raiz" class="logo-perfil">
        </div>
    </header>

    <div class="container-perfil">
        <!-- Seção Esquerda - Perfil -->
        <aside class="secao-perfil">
            <div class="card-perfil-usuario">
                <div class="foto-perfil">
                    <img src="frank.webp" alt="Foto de perfil" class="img-perfil">
                </div>
                <div class="info-perfil">
                    <h2 class="nome-usuario">Frank Ocean</h2>
                    <p class="usuario-social">@Blonded</p>
                </div>
            </div>
        </aside>

        <!-- Seção Direita - Stats e Review -->
        <main class="secao-principal">
            <!-- Cards de Estatísticas -->
            <div class="container-stats">
                <div class="card-stat">
                    <div class="numero-stat">11</div>
                    <div class="label-stat">Seguidores</div>
                </div>
                <div class="card-stat">
                    <div class="numero-stat">3</div>
                    <div class="label-stat">Restaurantes Curtidos</div>
                </div>
                <div class="card-stat">
                    <div class="numero-stat">2</div>
                    <div class="label-stat">Reviews</div>
                </div>
            </div>

            <!-- Card de Review -->
            <div class="card-review">
                <h3 class="titulo-review">Escrever uma review</h3>
                <div class="container-icones-review">
                    <button class="botao-icone-review" title="Câmera">
                        <span class="icone-slot"><img src="camera.svg" alt="Câmera"></span>
                    </button>
                    <button class="botao-icone-review" title="Olho">
                        <span class="icone-slot"><img src="loc.svg" alt="localização"></span>
                    </button>
                
                </div>
                <button class="botao-postar">Postar</button>
            </div>

        </main>
    </div>

    <script src="perfil.js"></script>
</body>
</html>
